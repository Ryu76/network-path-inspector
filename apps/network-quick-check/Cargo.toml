[package]
name = "network-quick-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "NetworkQuickCheck"
path = "src/main.rs"

[dependencies]
network-core = { path = "../../crates/network-core" }
serde_json = { workspace = true }
# 명시 개발용 경로에서만 런타임·신호 수신을 시작한다. 기존 버전을 직접 선언한다.
tokio = { version = "=1.52.3", features = ["rt", "time", "net", "signal", "sync", "macros"] }

# 소유 Child의 비동기 감독은 ignored native 시험에서만 사용한다.
[dev-dependencies]
tokio = { version = "=1.52.3", features = ["process"] }

# 네이티브 입력 화면만 사용하는 고정 Win32 바인딩. 부모가 준비한다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }
